spring.application.name=eventease-backend
server.port=${PORT:8080}

# PostgreSQL Database Configuration for Render / Production
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:eventease_super_secret_jwt_key_that_is_at_least_256_bits_long_for_hmac_sha256_security}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
