spring.application.name=eventease-backend
server.port=${PORT:8080}

# MySQL Database Configuration for Aiven / Cloud / Local
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/defaultdb?createDatabaseIfNotExist=true&useSSL=true&requireSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# JPA / Hibernate for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false

# SQL Initialization - use 'always' only on brand-new Aiven deployments.
# Set SPRING_SQL_INIT_MODE=always via Render env var for first-time setup only.
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.sql.init.schema-locations=classpath:schema-mysql.sql
spring.sql.init.data-locations=classpath:data-mysql.sql
spring.sql.init.continue-on-error=true

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:eventease_super_secret_jwt_key_that_is_at_least_256_bits_long_for_hmac_sha256_security}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

