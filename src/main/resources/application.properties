spring.application.name=eventease-backend
server.port=${PORT:8080}

# Database Configuration (Default: MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${DB_URL:jdbc:mysql://localhost:3306/eventease?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:${DB_USERNAME:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:${DB_PASSWORD:root}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# SQL Initialization - disabled for production (tables exist); DataLoader handles seed data
spring.sql.init.mode=never

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:eventease_super_secret_jwt_key_that_is_at_least_256_bits_long_for_hmac_sha256_security}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# File Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.eventease=INFO
